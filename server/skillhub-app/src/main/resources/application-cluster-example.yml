# Redis Cluster Configuration Example
# Copy this file to application-cluster.yml and modify the cluster nodes as needed

spring:
  data:
    redis:
      mode: cluster
      password: ${REDIS_PASSWORD:}
      cluster:
        # List of cluster nodes in host:port format
        nodes:
          - redis-node1:6379
          - redis-node2:6379
          - redis-node3:6379
          - redis-node4:6379
          - redis-node5:6379
          - redis-node6:6379
        max-redirects: 3

# For environment variables, set:
# SPRING_DATA_REDIS_MODE=cluster
# SPRING_DATA_REDIS_CLUSTER_NODES=redis-node1:6379,redis-node2:6379,redis-node3:6379
# SPRING_DATA_REDIS_CLUSTER_MAX_REDIRECTS=3
