# ============================================================================
# SkillHub Helm Chart 全局配置
# ============================================================================

# ============================================================================
# 镜像配置
# ============================================================================
images:
  registry: ghcr.io/iflytek
  tag: ""
  pullPolicy: IfNotPresent

nameOverride: ""
fullnameOverride: ""

# ============================================================================
# Ingress 配置
# ============================================================================
ingress:
  enabled: false
  className: nginx
  host: skills.example.com
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: 100m
  tls:
    enabled: false
    secretName: ""
  certManager:
    enabled: false
    issuerName: letsencrypt-prod
    issuerKind: ClusterIssuer

# ============================================================================
# S3 对象存储配置
# ============================================================================
s3:
  enabled: false
  bucket: skillhub-storage
  endpoint: ""
  region: us-east-1
  accessKey: ""
  secretKey: ""

# ============================================================================
# Session 配置
# ============================================================================
session:
  cookieSecure: false

# ============================================================================
# Bootstrap 管理员
# ============================================================================
bootstrapAdmin:
  enabled: true
  userId: docker-admin
  username: admin
  displayName: "Platform Admin"
  email: admin@example.com
  password: ""

# ============================================================================
# Spring Profiles
# ============================================================================
springProfilesActive: docker

# ============================================================================
# Secret 配置
# ============================================================================
existingSecret: ""

secrets:
  springDatasourcePassword: ""
  bootstrapAdminPassword: ""
  oauth2GithubClientId: ""
  oauth2GithubClientSecret: ""
  scannerLlmApiKey: ""
  scannerLlmModel: ""

# ============================================================================
# PostgreSQL 配置（Bitnami）
# ============================================================================
postgresql:
  enabled: true

  architecture: standalone

  auth:
    postgresPassword: ""
    database: skillhub
    username: skillhub
    password: ""

  primary:
    persistence:
      enabled: true
      size: 10Gi
      storageClass: ""
      accessModes:
        - ReadWriteOnce
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 1Gi
    extraEnv:
      - name: POSTGRES_MAX_CONNECTIONS
        value: "500"
    podAnnotations: {}
    podSecurityContext:
      enabled: true
      fsGroup: 1001
    containerSecurityContext:
      enabled: true
      runAsUser: 1001
    livenessProbe:
      enabled: true
      initialDelaySeconds: 30
      periodSeconds: 20
    readinessProbe:
      enabled: true
      initialDelaySeconds: 5
      periodSeconds: 10

  readReplicas:
    persistence:
      enabled: true
      size: 10Gi
      storageClass: ""
      accessModes:
        - ReadWriteOnce
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 1Gi

  metrics:
    enabled: true
    serviceMonitor:
      enabled: false

externalDatabase:
  host: postgres.example.com
  port: 5432
  database: skillhub
  username: skillhub
  password: ""
  jdbcUrl: ""

# ============================================================================
# Redis 配置（Bitnami）
# ============================================================================
redis:
  enabled: true

  architecture: standalone

  auth:
    enabled: true
    password: ""
    sentinelPassword: ""

  master:
    persistence:
      enabled: true
      size: 5Gi
      storageClass: ""
      accessModes:
        - ReadWriteOnce
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 200m
        memory: 512Mi
    podAnnotations: {}
    podSecurityContext:
      enabled: true
      fsGroup: 1001
    containerSecurityContext:
      enabled: true
      runAsUser: 1001

  replica:
    persistence:
      enabled: true
      size: 5Gi
      storageClass: ""
      accessModes:
        - ReadWriteOnce
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 200m
        memory: 512Mi

  sentinel:
    enabled: false
    masterSet: mymaster
    nodes: ""
    service:
      enabled: true
      ports:
        sentinel: 26379

  metrics:
    enabled: true
    serviceMonitor:
      enabled: false

externalRedis:
  host: redis.example.com
  port: 6379
  password: ""
  sentinel:
    enabled: false
    masterSet: mymaster
    nodes: []
    password: ""

# ============================================================================
# Server 配置
# ============================================================================
server:
  enabled: true
  replicaCount: 1

  image:
    registry: ""
    tag: ""

  service:
    enabled: true
    type: ClusterIP
    port: 8080
    nodePort: ""
    loadBalancerIP: ""
    loadBalancerSourceRanges: []

  storage:
    # 访问模式：留空时自动判断（单副本 RWO，多副本 RWX），或手动指定
    accessMode: ""
    size: 10Gi
    storageClassName: ""

  resources:
    requests:
      cpu: 500m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 1Gi

  javaOpts: ""
  extraEnv: []
  podAnnotations: {}
  imagePullSecrets: []
  nodeSelector: {}
  tolerations: []
  affinity: {}

  probes:
    startup:
      httpGet:
        path: /actuator/health
        port: http
      initialDelaySeconds: 10
      periodSeconds: 10
      failureThreshold: 30
    readiness:
      httpGet:
        path: /actuator/health
        port: http
      initialDelaySeconds: 20
      periodSeconds: 10
    liveness:
      httpGet:
        path: /actuator/health
        port: http
      initialDelaySeconds: 30
      periodSeconds: 15

  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 10
    targetCPUUtilizationPercentage: 80
    targetMemoryUtilizationPercentage: 80

  podDisruptionBudget:
    enabled: false
    minAvailable: 1

# ============================================================================
# Web 配置
# ============================================================================
web:
  replicaCount: 1
  image:
    registry: ""
    tag: ""

  service:
    enabled: true
    type: ClusterIP
    port: 80
    nodePort: ""
    loadBalancerIP: ""
    loadBalancerSourceRanges: []

  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi

  extraEnv: []
  podAnnotations: {}
  imagePullSecrets: []
  nodeSelector: {}
  tolerations: []
  affinity: {}

  probes:
    readiness:
      httpGet:
        path: /nginx-health
        port: http
      initialDelaySeconds: 5
      periodSeconds: 10
    liveness:
      httpGet:
        path: /nginx-health
        port: http
      initialDelaySeconds: 10
      periodSeconds: 15

  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 5
    targetCPUUtilizationPercentage: 80
    targetMemoryUtilizationPercentage: 80

  podDisruptionBudget:
    enabled: false
    minAvailable: 1

# ============================================================================
# Scanner 配置
# ============================================================================
scanner:
  enabled: true
  replicaCount: 1
  image:
    registry: ""
    tag: ""

  service:
    port: 8000

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

  extraEnv: []
  podAnnotations: {}
  imagePullSecrets: []
  nodeSelector: {}
  tolerations: []
  affinity: {}

  probes:
    readiness:
      httpGet:
        path: /health
        port: http
      initialDelaySeconds: 10
      periodSeconds: 10
    liveness:
      httpGet:
        path: /health
        port: http
      initialDelaySeconds: 20
      periodSeconds: 15

  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 5
    targetCPUUtilizationPercentage: 80
    targetMemoryUtilizationPercentage: 80

  podDisruptionBudget:
    enabled: false
    minAvailable: 1
