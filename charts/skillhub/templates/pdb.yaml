{{- if .Values.server.podDisruptionBudget.enabled }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "skillhub.fullname" . }}-server
  labels:
    {{- include "skillhub.server.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "skillhub.server.selectorLabels" . | nindent 6 }}
  minAvailable: {{ .Values.server.podDisruptionBudget.minAvailable }}
{{- end }}

{{- if .Values.web.podDisruptionBudget.enabled }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "skillhub.fullname" . }}-web
  labels:
    {{- include "skillhub.web.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "skillhub.web.selectorLabels" . | nindent 6 }}
  minAvailable: {{ .Values.web.podDisruptionBudget.minAvailable }}
{{- end }}

{{- if and .Values.scanner.enabled .Values.scanner.podDisruptionBudget.enabled }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "skillhub.fullname" . }}-scanner
  labels:
    {{- include "skillhub.scanner.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "skillhub.scanner.selectorLabels" . | nindent 6 }}
  minAvailable: {{ .Values.scanner.podDisruptionBudget.minAvailable }}
{{- end }}
