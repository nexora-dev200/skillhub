{{- if eq .Values.storage.provider "local" }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "skillhub.fullname" . }}-storage-pvc
  labels:
    {{- include "skillhub.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
spec:
  accessModes:
    - {{ .Values.storage.local.accessMode }}
  {{- if .Values.storage.local.storageClassName }}
  storageClassName: {{ .Values.storage.local.storageClassName }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.storage.local.storage }}
{{- end }}
