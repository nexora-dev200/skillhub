{{- if not .Values.existingSecret }}
{{- $secretName := printf "%s-secret" (include "skillhub.fullname" .) }}
{{- $existingSecret := (lookup "v1" "Secret" .Release.Namespace $secretName) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  labels:
    {{- include "skillhub.labels" . | nindent 4 }}
type: Opaque
stringData:
  spring-datasource-url: {{ include "skillhub.jdbcUrl" . | quote }}
  spring-datasource-username: {{ if eq .Values.database.mode "internal" }}skillhub{{ else }}{{ .Values.database.external.username }}{{ end }}

  {{- $dsPwd := "" }}
  {{- if $existingSecret }}
    {{- $dsPwd = $existingSecret.data.springDatasourcePassword | b64dec }}
  {{- else if eq .Values.database.mode "internal" }}
    {{- $dsPwd = default (randAlphaNum 16) .Values.secrets.springDatasourcePassword }}
  {{- else }}
    {{- $dsPwd = .Values.database.external.password }}
  {{- end }}
  spring-datasource-password: {{ $dsPwd | quote }}

  {{- $redisPwd := "" }}
  {{- if $existingSecret }}
    {{- $redisPwd = $existingSecret.data.redisPassword | b64dec }}
  {{- else }}
    {{- $redisPwd = .Values.redis.external.password | default "" }}
  {{- end }}
  {{- if $redisPwd }}
  redis-password: {{ $redisPwd | quote }}
  {{- end }}

  {{- $s3Key := "" }}
  {{- if $existingSecret }}
    {{- $s3Key = $existingSecret.data.s3AccessKey | b64dec }}
  {{- else }}
    {{- $s3Key = .Values.storage.s3.accessKey | default "" }}
  {{- end }}
  {{- if $s3Key }}
  s3-access-key: {{ $s3Key | quote }}
  {{- end }}

  {{- $s3Secret := "" }}
  {{- if $existingSecret }}
    {{- $s3Secret = $existingSecret.data.s3SecretKey | b64dec }}
  {{- else }}
    {{- $s3Secret = .Values.storage.s3.secretKey | default "" }}
  {{- end }}
  {{- if $s3Secret }}
  s3-secret-key: {{ $s3Secret | quote }}
  {{- end }}

  {{- $baPwd := "" }}
  {{- if $existingSecret }}
    {{- $baPwd = $existingSecret.data.bootstrapAdminPassword | b64dec }}
  {{- else }}
    {{- $baPwd = .Values.secrets.bootstrapAdminPassword | default .Values.bootstrapAdmin.password | default (randAlphaNum 16) }}
  {{- end }}
  bootstrap-admin-password: {{ $baPwd | quote }}

  {{- if .Values.secrets.oauth2GithubClientId }}
  oauth2-github-client-id: {{ .Values.secrets.oauth2GithubClientId }}
  {{- end }}
  {{- if .Values.secrets.oauth2GithubClientSecret }}
  oauth2-github-client-secret: {{ .Values.secrets.oauth2GithubClientSecret }}
  {{- end }}
  {{- if .Values.secrets.scannerLlmApiKey }}
  skill-scanner-llm-api-key: {{ .Values.secrets.scannerLlmApiKey }}
  {{- end }}
  {{- if .Values.secrets.scannerLlmModel }}
  skill-scanner-llm-model: {{ .Values.secrets.scannerLlmModel }}
  {{- end }}
{{- end }}
