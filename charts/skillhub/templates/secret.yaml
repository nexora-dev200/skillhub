{{- if not .Values.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "skillhub.fullname" . }}-secret
  labels:
    {{- include "skillhub.labels" . | nindent 4 }}
type: Opaque
stringData:
  spring-datasource-url: {{ include "skillhub.jdbcUrl" . | quote }}
  spring-datasource-username: {{ if eq .Values.database.mode "internal" }}skillhub{{ else }}{{ .Values.database.external.username }}{{ end }}
  spring-datasource-password: {{ if eq .Values.database.mode "internal" }}{{ default (randAlphaNum 16) .Values.secrets.springDatasourcePassword }}{{ else }}{{ .Values.database.external.password }}{{ end }}

  bootstrap-admin-password: {{ .Values.secrets.bootstrapAdminPassword | default .Values.bootstrapAdmin.password | default (randAlphaNum 16) }}

  {{- if .Values.secrets.oauth2GithubClientId }}
  oauth2-github-client-id: {{ .Values.secrets.oauth2GithubClientId }}
  {{- end }}
  {{- if .Values.secrets.oauth2GithubClientSecret }}
  oauth2-github-client-secret: {{ .Values.secrets.oauth2GithubClientSecret }}
  {{- end }}
  {{- if .Values.secrets.scannerLlmApiKey }}
  skill-scanner-llm-api-key: {{ .Values.secrets.scannerLlmApiKey }}
  {{- end }}
  {{- if .Values.secrets.scannerLlmModel }}
  skill-scanner-llm-model: {{ .Values.secrets.scannerLlmModel }}
  {{- end }}
{{- end }}
