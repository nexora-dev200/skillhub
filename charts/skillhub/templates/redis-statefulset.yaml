{{- if eq .Values.redis.mode "internal" }}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "skillhub.fullname" . }}-redis
  labels:
    {{- include "skillhub.labels" . | nindent 4 }}
    app.kubernetes.io/component: cache
spec:
  serviceName: {{ include "skillhub.fullname" . }}-redis
  replicas: 1
  selector:
    matchLabels:
      {{- include "skillhub.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: cache
  template:
    metadata:
      labels:
        {{- include "skillhub.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: cache
    spec:
      containers:
        - name: redis
          image: {{ .Values.redis.internal.registry }}/{{ .Values.redis.internal.image }}
          ports:
            - containerPort: 6379
              name: redis
          command:
            - redis-server
            - --appendonly
            - "yes"
          volumeMounts:
            - name: redis-data
              mountPath: /data
          resources:
            {{- toYaml .Values.redis.internal.resources | nindent 12 }}
          readinessProbe:
            exec:
              command:
                - redis-cli
                - ping
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            exec:
              command:
                - redis-cli
                - ping
            initialDelaySeconds: 10
            periodSeconds: 15
  volumeClaimTemplates:
    - metadata:
        name: redis-data
        labels:
          {{- include "skillhub.labels" . | nindent 10 }}
      spec:
        accessModes:
          - {{ .Values.storage.local.accessMode }}
        {{- if .Values.redis.internal.storageClassName }}
        storageClassName: {{ .Values.redis.internal.storageClassName }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.redis.internal.storage }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "skillhub.fullname" . }}-redis
  labels:
    {{- include "skillhub.labels" . | nindent 4 }}
    app.kubernetes.io/component: cache
spec:
  type: ClusterIP
  ports:
    - port: 6379
      targetPort: redis
      name: redis
  selector:
    {{- include "skillhub.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: cache
{{- end }}
