apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "skillhub.fullname" . }}-server
  labels:
    {{- include "skillhub.server.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "skillhub.server.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "skillhub.server.selectorLabels" . | nindent 8 }}
      annotations:
        checksum/config: {{ toYaml (dict "redis" .Values.redis "storage" .Values.storage "database" .Values.database "session" .Values.session "springProfilesActive" .Values.springProfilesActive "bootstrapAdmin" .Values.bootstrapAdmin) | sha256sum }}
        checksum/secret: {{ toYaml (dict "secrets" .Values.secrets "bootstrapAdmin" .Values.bootstrapAdmin) | sha256sum }}
        {{- range $key, $val := .Values.server.podAnnotations }}
        {{ $key }}: {{ $val }}
        {{- end }}
    spec:
      {{- $secrets := .Values.server.imagePullSecrets | default .Values.global.imagePullSecrets }}
      {{- if $secrets }}
      imagePullSecrets:
        {{- toYaml $secrets | nindent 8 }}
      {{- end }}
      initContainers:
        - name: wait-for-dependencies
          image: busybox:latest
          env:
            - name: DB_HOST
              value: {{ include "skillhub.jdbcHost" . }}
            - name: DB_PORT
              value: {{ include "skillhub.jdbcPort" . | quote }}
            - name: REDIS_HOST
              value: {{ include "skillhub.redisHost" . }}
            - name: REDIS_PORT
              value: {{ include "skillhub.redisPort" . | quote }}
          command:
            - sh
            - -c
            - |
              echo "Waiting for PostgreSQL at ${DB_HOST}:${DB_PORT}..."
              until nc -z -w 2 "${DB_HOST}" "${DB_PORT}"; do sleep 2; done
              echo "PostgreSQL is ready!"
              echo "Waiting for Redis at ${REDIS_HOST}:${REDIS_PORT}..."
              until nc -z -w 2 "${REDIS_HOST}" "${REDIS_PORT}"; do sleep 2; done
              echo "Redis is ready!"
      containers:
        - name: server
          image: {{ .Values.global.imageRegistry | default .Values.images.registry }}/skillhub-server:{{ .Values.images.tag | default (printf "v%s" .Chart.AppVersion) }}
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          ports:
            - containerPort: {{ .Values.service.serverPort }}
              name: http
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: {{ .Values.springProfilesActive }}

            # Database
            - name: SPRING_DATASOURCE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "skillhub.secretName" . }}
                  key: spring-datasource-url
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ include "skillhub.secretName" . }}
                  key: spring-datasource-username
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "skillhub.secretName" . }}
                  key: spring-datasource-password

            # Redis
            - name: SPRING_DATA_REDIS_HOST
              valueFrom:
                configMapKeyRef:
                  name: {{ include "skillhub.fullname" . }}-config
                  key: redis-host
            - name: SPRING_DATA_REDIS_PORT
              valueFrom:
                configMapKeyRef:
                  name: {{ include "skillhub.fullname" . }}-config
                  key: redis-port

            {{- if eq .Values.redis.mode "external" }}
            - name: SPRING_DATA_REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "skillhub.secretName" . }}
                  key: redis-password
                  optional: true
            {{- end }}

            {{- if .Values.redis.external.sentinel.enabled }}
            - name: SPRING_DATA_REDIS_SENTINEL_MASTER
              value: {{ .Values.redis.external.sentinel.masterSet }}
            - name: SPRING_DATA_REDIS_SENTINEL_NODES
              value: {{ join "," .Values.redis.external.sentinel.nodes }}
            {{- end }}

            # Storage
            - name: STORAGE_BASE_PATH
              valueFrom:
                configMapKeyRef:
                  name: {{ include "skillhub.fullname" . }}-config
                  key: storage-base-path
            - name: SKILLHUB_STORAGE_PROVIDER
              valueFrom:
                configMapKeyRef:
                  name: {{ include "skillhub.fullname" . }}-config
                  key: skillhub-storage-provider

            {{- if eq .Values.storage.provider "s3" }}
            - name: SKILLHUB_S3_BUCKET
              value: {{ .Values.storage.s3.bucket }}
            - name: SKILLHUB_S3_ENDPOINT
              value: {{ .Values.storage.s3.endpoint }}
            - name: SKILLHUB_S3_REGION
              value: {{ .Values.storage.s3.region }}
            - name: SKILLHUB_S3_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "skillhub.secretName" . }}
                  key: s3-access-key
                  optional: true
            - name: SKILLHUB_S3_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "skillhub.secretName" . }}
                  key: s3-secret-key
                  optional: true
            {{- end }}

            # Scanner
            - name: SKILLHUB_SECURITY_SCANNER_ENABLED
              valueFrom:
                configMapKeyRef:
                  name: {{ include "skillhub.fullname" . }}-config
                  key: skill-scanner-enabled
            - name: SKILLHUB_SECURITY_SCANNER_URL
              valueFrom:
                configMapKeyRef:
                  name: {{ include "skillhub.fullname" . }}-config
                  key: skill-scanner-url
            - name: SKILLHUB_SECURITY_SCANNER_MODE
              valueFrom:
                configMapKeyRef:
                  name: {{ include "skillhub.fullname" . }}-config
                  key: skill-scanner-mode

            # Session
            - name: SESSION_COOKIE_SECURE
              valueFrom:
                configMapKeyRef:
                  name: {{ include "skillhub.fullname" . }}-config
                  key: session-cookie-secure

            # Bootstrap Admin
            - name: BOOTSTRAP_ADMIN_ENABLED
              valueFrom:
                configMapKeyRef:
                  name: {{ include "skillhub.fullname" . }}-config
                  key: bootstrap-admin-enabled
            - name: BOOTSTRAP_ADMIN_USER_ID
              valueFrom:
                configMapKeyRef:
                  name: {{ include "skillhub.fullname" . }}-config
                  key: bootstrap-admin-user-id
            - name: BOOTSTRAP_ADMIN_USERNAME
              valueFrom:
                configMapKeyRef:
                  name: {{ include "skillhub.fullname" . }}-config
                  key: bootstrap-admin-username
            - name: BOOTSTRAP_ADMIN_DISPLAY_NAME
              valueFrom:
                configMapKeyRef:
                  name: {{ include "skillhub.fullname" . }}-config
                  key: bootstrap-admin-display-name
            - name: BOOTSTRAP_ADMIN_EMAIL
              valueFrom:
                configMapKeyRef:
                  name: {{ include "skillhub.fullname" . }}-config
                  key: bootstrap-admin-email
            - name: BOOTSTRAP_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "skillhub.secretName" . }}
                  key: bootstrap-admin-password
                  optional: true

            # OAuth2 GitHub (optional)
            - name: OAUTH2_GITHUB_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: {{ include "skillhub.secretName" . }}
                  key: oauth2-github-client-id
                  optional: true
            - name: OAUTH2_GITHUB_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "skillhub.secretName" . }}
                  key: oauth2-github-client-secret
                  optional: true

            {{- if .Values.server.javaOpts }}
            - name: JAVA_OPTS
              value: {{ .Values.server.javaOpts }}
            {{- end }}

            {{- with .Values.server.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}

          volumeMounts:
            - name: skillhub-storage
              mountPath: /var/lib/skillhub/storage

          resources:
            {{- toYaml .Values.server.resources | nindent 12 }}

          startupProbe:
            {{- toYaml .Values.server.probes.startup | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.server.probes.readiness | nindent 12 }}
          livenessProbe:
            {{- toYaml .Values.server.probes.liveness | nindent 12 }}

      volumes:
        - name: skillhub-storage
          persistentVolumeClaim:
            claimName: {{ include "skillhub.fullname" . }}-storage-pvc
      {{- with .Values.server.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.server.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.server.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
