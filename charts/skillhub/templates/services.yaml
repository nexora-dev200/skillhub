---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "skillhub.fullname" . }}-server
  labels:
    {{- include "skillhub.server.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  {{- if eq .Values.service.type "LoadBalancer" }}
  {{- if .Values.service.loadBalancerIP }}
  loadBalancerIP: {{ .Values.service.loadBalancerIP }}
  {{- end }}
  {{- if .Values.service.loadBalancerSourceRanges }}
  loadBalancerSourceRanges:
    {{- toYaml .Values.service.loadBalancerSourceRanges | nindent 4 }}
  {{- end }}
  {{- end }}
  ports:
    - name: http
      port: {{ .Values.service.serverPort }}
      targetPort: http
      {{- if and (eq .Values.service.type "NodePort") .Values.service.serverNodePort }}
      nodePort: {{ .Values.service.serverNodePort }}
      {{- end }}
  selector:
    {{- include "skillhub.server.selectorLabels" . | nindent 4 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "skillhub.fullname" . }}-web
  labels:
    {{- include "skillhub.web.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  {{- if eq .Values.service.type "LoadBalancer" }}
  {{- if .Values.service.loadBalancerIP }}
  loadBalancerIP: {{ .Values.service.loadBalancerIP }}
  {{- end }}
  {{- if .Values.service.loadBalancerSourceRanges }}
  loadBalancerSourceRanges:
    {{- toYaml .Values.service.loadBalancerSourceRanges | nindent 4 }}
  {{- end }}
  {{- end }}
  ports:
    - name: http
      port: {{ .Values.service.webPort }}
      targetPort: http
      {{- if and (eq .Values.service.type "NodePort") .Values.service.webNodePort }}
      nodePort: {{ .Values.service.webNodePort }}
      {{- end }}
  selector:
    {{- include "skillhub.web.selectorLabels" . | nindent 4 }}
{{- if .Values.scanner.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "skillhub.fullname" . }}-scanner
  labels:
    {{- include "skillhub.scanner.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  {{- if eq .Values.service.type "LoadBalancer" }}
  {{- if .Values.service.loadBalancerIP }}
  loadBalancerIP: {{ .Values.service.loadBalancerIP }}
  {{- end }}
  {{- if .Values.service.loadBalancerSourceRanges }}
  loadBalancerSourceRanges:
    {{- toYaml .Values.service.loadBalancerSourceRanges | nindent 4 }}
  {{- end }}
  {{- end }}
  ports:
    - name: http
      port: {{ .Values.service.scannerPort }}
      targetPort: http
      {{- if and (eq .Values.service.type "NodePort") .Values.service.scannerNodePort }}
      nodePort: {{ .Values.service.scannerNodePort }}
      {{- end }}
  selector:
    {{- include "skillhub.scanner.selectorLabels" . | nindent 4 }}
{{- end }}
