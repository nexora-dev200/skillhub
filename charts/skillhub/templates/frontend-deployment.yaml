apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "skillhub.fullname" . }}-web
  labels:
    {{- include "skillhub.web.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "skillhub.web.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "skillhub.web.selectorLabels" . | nindent 8 }}
      annotations:
        checksum/config: {{ toYaml (dict "redis" .Values.redis "storage" .Values.storage "database" .Values.database "session" .Values.session "springProfilesActive" .Values.springProfilesActive "bootstrapAdmin" .Values.bootstrapAdmin) | sha256sum }}
        checksum/secret: {{ toYaml (dict "secrets" .Values.secrets "bootstrapAdmin" .Values.bootstrapAdmin) | sha256sum }}
        {{- range $key, $val := .Values.web.podAnnotations }}
        {{ $key }}: {{ $val }}
        {{- end }}
    spec:
      {{- $secrets := .Values.web.imagePullSecrets | default .Values.global.imagePullSecrets }}
      {{- if $secrets }}
      imagePullSecrets:
        {{- toYaml $secrets | nindent 8 }}
      {{- end }}
      containers:
        - name: web
          image: {{ .Values.global.imageRegistry | default .Values.images.registry }}/skillhub-web:{{ .Values.web.image.tag | default .Values.images.tag | default (printf "v%s" .Chart.AppVersion) }}
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          env:
            - name: SKILLHUB_API_UPSTREAM
              value: http://{{ include "skillhub.fullname" . }}-server:{{ .Values.service.serverPort }}
            {{- with .Values.web.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          ports:
            - containerPort: {{ .Values.service.webPort }}
              name: http
          resources:
            {{- toYaml .Values.web.resources | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.web.probes.readiness | nindent 12 }}
          livenessProbe:
            {{- toYaml .Values.web.probes.liveness | nindent 12 }}
      {{- with .Values.web.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.web.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.web.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
